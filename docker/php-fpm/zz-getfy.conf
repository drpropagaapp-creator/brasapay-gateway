; Pool do PHP-FPM do container "app" (lido depois do www.conf padrão: zz- sobrescreve).
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
; Mesmo usuário do php artisan serve atual (root): os arquivos de storage/logs/sessões no volume
; foram criados como root. Rodar como www-data exigiria migrar dono/permissões do volume antes.
user = root
group = root
listen = 127.0.0.1:9000

; A maior parte do tempo é espera de rede (adquirentes, banco), não CPU: mais processos que núcleos.
; Pool fixo: no teste, criar processo sob demanda atrasava as rajadas ("seems busy").
; ~60 MB por processo → 12 ≈ 720 MB, com folga nos 8 GB da VPS.
pm = static
pm.max_children = 12
pm.max_requests = 1000

; Acima do fastcgi_read_timeout do nginx não faz sentido; abaixo disso o PHP mata a requisição presa.
request_terminate_timeout = 630s

; O Compose passa APP_ENV, CACHE_STORE, QUEUE_CONNECTION, GETFY_* etc. como variáveis de ambiente.
; Sem isto o FPM limparia o ambiente e o Laravel cairia nos padrões do .env.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
