# Servidor web de produção: nginx entrega public/ direto e repassa o PHP ao PHP-FPM (127.0.0.1:9000).
# O HTTPS fica na Cloudflare/proxy da frente; os cabeçalhos X-Forwarded-* chegam ao PHP como HTTP_* e
# o Laravel (TrustProxies + ForceHttpsWhenForwardedProto) decide, como já fazia com o php artisan serve.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Uploads (Member Builder, checkout, importação de produto): mesmo limite do uploads.ini.
    client_max_body_size 512m;
    client_body_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Assets do Vite têm hash no nome: cache longo.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    # Arquivo existente em public/ é servido direto; o resto vai para o Laravel.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Só o front controller executa PHP.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        # Cobranças esperam a adquirente (até ~25 s); a migração de storage pode levar até 600 s.
        fastcgi_read_timeout 620s;
        fastcgi_send_timeout 620s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
